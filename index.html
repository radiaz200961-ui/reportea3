<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Constructor de Reporte A3</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx-populate/1.21.0/xlsx-populate-no-encryption.min.js"></script>
<style>
  :root{
    --bg:#EDF0F2;
    --panel:#FFFFFF;
    --ink:#1B2430;
    --ink-soft:#5B6672;
    --ink-faint:#8A93A0;
    --accent:#E8A33D;
    --accent-ink:#402D06;
    --good:#2E7D5B;
    --good-bg:#E7F3EC;
    --bad:#C1442E;
    --bad-bg:#FBEAE6;
    --steel:#3C5A72;
    --steel-bg:#E7EDF1;
    --line:#D8DEE3;
    --line-strong:#B9C2CA;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg);
    color:var(--ink);
    font-family:'Inter',system-ui,sans-serif;
    font-size:14px;
    line-height:1.5;
  }
  .app{
    display:flex;
    min-height:100vh;
  }
  /* ---------- SIDEBAR ---------- */
  .sidebar{
    width:280px;
    flex:0 0 280px;
    background:var(--ink);
    color:#fff;
    padding:28px 20px 20px;
    position:sticky;
    top:0;
    height:100vh;
    overflow-y:auto;
  }
  .brand{
    font-family:'Oswald',sans-serif;
    font-weight:600;
    letter-spacing:0.03em;
    font-size:12px;
    text-transform:uppercase;
    color:var(--accent);
    margin-bottom:2px;
  }
  .brand-title{
    font-family:'Oswald',sans-serif;
    font-weight:700;
    font-size:22px;
    letter-spacing:0.01em;
    margin:0 0 22px;
    line-height:1.15;
  }
  .step-list{
    list-style:none;
    margin:0;
    padding:0;
    border-left:2px solid rgba(255,255,255,0.14);
  }
  .step-item{
    position:relative;
    padding:10px 0 10px 20px;
    margin-left:-2px;
    cursor:pointer;
    opacity:0.45;
    transition:opacity .15s ease;
  }
  .step-item.enabled{opacity:0.75;}
  .step-item.enabled:hover{opacity:1;}
  .step-item.active{opacity:1;}
  .step-item::before{
    content:'';
    position:absolute;
    left:-6px; top:16px;
    width:10px;height:10px;
    border-radius:50%;
    background:#4A5568;
    border:2px solid var(--ink);
  }
  .step-item.active::before{background:var(--accent);}
  .step-item.done::before{background:var(--good);}
  .step-num{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    color:rgba(255,255,255,0.5);
    letter-spacing:0.05em;
  }
  .step-item.active .step-num{color:var(--accent);}
  .step-name{
    font-size:13.5px;
    font-weight:500;
    margin-top:1px;
  }
  .step-tag{
    display:inline-block;
    margin-top:5px;
    font-family:'IBM Plex Mono',monospace;
    font-size:9.5px;
    letter-spacing:0.06em;
    padding:2px 6px;
    border-radius:4px;
  }
  .step-tag.ok{background:rgba(46,125,91,0.25);color:#8FDCB4;}
  .step-tag.pending{background:rgba(255,255,255,0.08);color:rgba(255,255,255,0.45);}
  .sidebar-foot{
    margin-top:26px;
    padding-top:16px;
    border-top:1px solid rgba(255,255,255,0.12);
    font-size:11.5px;
    color:rgba(255,255,255,0.45);
  }

  /* ---------- MAIN ---------- */
  .main{
    flex:1;
    min-width:0;
    padding:34px 44px 80px;
    max-width:900px;
  }
  .topline{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin-bottom:26px;
  }
  .eyebrow{
    font-family:'IBM Plex Mono',monospace;
    font-size:11px;
    letter-spacing:0.08em;
    color:var(--ink-faint);
    text-transform:uppercase;
  }
  h1.step-title{
    font-family:'Oswald',sans-serif;
    font-size:30px;
    font-weight:600;
    margin:2px 0 4px;
    letter-spacing:0.01em;
  }
  .step-sub{
    color:var(--ink-soft);
    font-size:14px;
    max-width:620px;
    margin-bottom:26px;
  }

  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:24px 26px;
    margin-bottom:18px;
  }
  .field{margin-bottom:18px;}
  .field:last-child{margin-bottom:0;}
  label{
    display:block;
    font-weight:600;
    font-size:13px;
    margin-bottom:6px;
    color:var(--ink);
  }
  label .req{color:var(--bad);}
  .hint{
    font-size:12px;
    color:var(--ink-faint);
    margin-top:5px;
  }
  input[type=text], input[type=date], input[type=number], textarea, select{
    width:100%;
    border:1px solid var(--line-strong);
    border-radius:7px;
    padding:9px 11px;
    font-family:'Inter',sans-serif;
    font-size:13.5px;
    color:var(--ink);
    background:#fff;
    transition:border-color .12s ease, box-shadow .12s ease;
  }
  textarea{resize:vertical;min-height:78px;}
  input:focus, textarea:focus, select:focus{
    outline:none;
    border-color:var(--steel);
    box-shadow:0 0 0 3px rgba(60,90,114,0.14);
  }
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
  .row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:16px;}

  .repeat-block{
    border:1px dashed var(--line-strong);
    border-radius:8px;
    padding:14px 14px 6px;
    margin-bottom:10px;
    background:#FBFBFA;
    position:relative;
  }
  .repeat-block .rm-btn{
    position:absolute; top:8px; right:8px;
    background:none;border:none;color:var(--bad);
    font-size:11px;cursor:pointer;font-family:'IBM Plex Mono',monospace;
    letter-spacing:.04em;
  }
  .add-btn, .btn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:13px;
    border-radius:7px;
    padding:9px 16px;
    border:1px solid var(--line-strong);
    background:#fff;
    color:var(--ink);
    cursor:pointer;
  }
  .add-btn:hover{border-color:var(--steel);color:var(--steel);}
  .btn-primary{
    background:var(--ink);
    color:#fff;
    border-color:var(--ink);
  }
  .btn-primary:hover{background:#0e1420;}
  .btn-primary:disabled{opacity:0.4;cursor:not-allowed;}
  .btn-ghost{background:transparent;border-color:transparent;color:var(--ink-soft);}
  .btn-ghost:hover{color:var(--ink);}

  .actions-bar{
    display:flex;justify-content:space-between;align-items:center;margin-top:22px;
  }

  /* error / stamp */
  .errors{
    background:var(--bad-bg);
    border:1px solid #EFC3B7;
    color:#7C2A16;
    border-radius:8px;
    padding:14px 16px;
    margin-bottom:18px;
    font-size:13px;
  }
  .errors strong{display:block;margin-bottom:6px;font-size:12.5px;letter-spacing:.02em;}
  .errors ul{margin:0;padding-left:18px;}
  .errors li{margin-bottom:3px;}

  .stamp{
    display:inline-flex;
    align-items:center;
    gap:8px;
    font-family:'IBM Plex Mono',monospace;
    font-weight:600;
    font-size:12.5px;
    letter-spacing:0.08em;
    padding:8px 14px;
    border:2.5px solid var(--good);
    color:var(--good);
    border-radius:6px;
    transform:rotate(-2deg);
    text-transform:uppercase;
  }

  .section-index{
    font-family:'Oswald',sans-serif;
    font-size:15px;
    font-weight:600;
    color:var(--steel);
    margin:0 0 2px;
  }

  table.mini{width:100%;border-collapse:collapse;margin-top:6px;}
  table.mini th{
    font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--ink-faint);
    text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);
  }
  table.mini td{padding:4px 6px;vertical-align:top;}

  .summary-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .summary-card{border:1px solid var(--line);border-radius:8px;padding:14px 16px;background:#FAFAF9;}
  .summary-card h4{margin:0 0 8px;font-family:'Oswald',sans-serif;font-size:14px;color:var(--steel);}
  .summary-card p{margin:0 0 4px;font-size:12.5px;color:var(--ink-soft);white-space:pre-wrap;}
  .summary-card b{color:var(--ink);}

  @media (max-width:860px){
    .app{flex-direction:column;}
    .sidebar{width:100%;flex:none;height:auto;position:relative;}
    .main{max-width:100%;padding:24px 18px 60px;}
    .row2,.row3{grid-template-columns:1fr;}
    .summary-grid{grid-template-columns:1fr;}
  }
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">Análisis 5S · Talleres de Líderes</div>
    <p class="brand-title">Constructor<br>de Reporte A3</p>
    <ul class="step-list" id="stepList"></ul>
    <div class="sidebar-foot">Cada punto se valida antes de habilitar el siguiente. El Excel final se genera recién al completar los 6 puntos.</div>
  </aside>
  <main class="main" id="main"></main>
</div>

<script>
/* =========================================================================
   CONSTRUCTOR DE REPORTE A3 — lógica de la app
   ========================================================================= */

/* ---------- estado ---------- */
const state = {
  header: { fechaInicio:'', reporteNro:'', sector:'', titulo:'' },
  s1: { problema:'', areaProceso:'', impacto:'' },
  s2: { objetivo:'', indicador:'', metaValor:'', plazoFecha:'', verificacion:'' },
  s3: {
    herramientas:['5 Porqués'],
    detalleHerramienta:'',
    resumenAnalisis:'',
    why: [
      { w1:'', w2:'', w3:'', w4:'', w5:'', resultado:'' },
      { w1:'', w2:'', w3:'', w4:'', w5:'', resultado:'' },
      { w1:'', w2:'', w3:'', w4:'', w5:'', resultado:'' },
      { w1:'', w2:'', w3:'', w4:'', w5:'', resultado:'' },
      { w1:'', w2:'', w3:'', w4:'', w5:'', resultado:'' }
    ],
    ishikawa: {
      categorias: [
        { nombre:'Mano de obra',   causas:[''] },
        { nombre:'Método',         causas:[''] },
        { nombre:'Máquina',        causas:[''] },
        { nombre:'Material',       causas:[''] },
        { nombre:'Medición',       causas:[''] },
        { nombre:'Medio ambiente', causas:[''] }
      ]
    }
  },
  s4: {
    acciones: [ { accion:'', responsable:'', fecha:'' } ],
    contramedidas:'',
    fechaCompromiso:''
  },
  s5: {
    realizadas: [ { accion:'', fecha:'' } ],
    fechaImplementacion:''
  },
  s6: {
    plazoEvaluacion:'', indicadorCriterio:'', resultado:'',
    conclusion:'EFICAZ', accionesAdicionales:'',
    formulariosLoyal:'', fechaCierre:'', responsableCierre:''
  }
};

const STEPS = [
  { key:'header', num:'00', name:'Datos generales' },
  { key:'s1', num:'01', name:'1. Problemática' },
  { key:'s2', num:'02', name:'2. Metas / Objetivos' },
  { key:'s3', num:'03', name:'3. Situación actual' },
  { key:'s4', num:'04', name:'4. Acciones propuestas' },
  { key:'s5', num:'05', name:'5. Acciones realizadas' },
  { key:'s6', num:'06', name:'6. Verificación de eficacia' },
];

let current = 0;
let maxUnlocked = 0;
const stepStatus = Array(STEPS.length).fill(false);
let lastErrors = [];

/* ---------- helpers ---------- */
const $ = (sel, root=document) => root.querySelector(sel);
const $$ = (sel, root=document) => Array.from(root.querySelectorAll(sel));

function esc(str){
  return (str||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function parseISO(d){ // 'YYYY-MM-DD' -> Date (local, no TZ shift)
  if(!d) return null;
  const [y,m,day] = d.split('-').map(Number);
  if(!y||!m||!day) return null;
  return new Date(y, m-1, day);
}
function fmtDate(d){ // 'YYYY-MM-DD' -> 'DD/MM/AAAA'
  if(!d) return '';
  const [y,m,day] = d.split('-');
  return `${day}/${m}/${y}`;
}
function monthsBetween(d1, d2){
  if(!d1||!d2) return null;
  let months = (d2.getFullYear()-d1.getFullYear())*12 + (d2.getMonth()-d1.getMonth());
  if(d2.getDate() < d1.getDate()) months -= 1;
  const dayFrac = (d2 - d1) / (1000*60*60*24);
  return dayFrac/30.44; // usamos días/30.44 para un control más fino que meses enteros
}
const SUBJECTIVE_WORDS = [
  'creo que','pienso que','en mi opinión','me parece que','me parece','tal vez','quizás','quizas',
  'posiblemente','algunos dicen','se dice que','parece que','siento que','da la sensación',
  'a mi entender','supuestamente','probablemente'
];
const PLACEHOLDER_REJECT = ['n/a','na','no aplica','no corresponde','ninguna','ninguno','-','x','...','sin datos'];

function hasSubjectiveLanguage(text){
  const t = (text||'').toLowerCase();
  return SUBJECTIVE_WORDS.find(w => t.includes(w)) || null;
}
function hasQuantData(text){
  return /\d/.test(text||'');
}
function isPlaceholder(text){
  const t = (text||'').trim().toLowerCase().replace(/\.+$/,'');
  return PLACEHOLDER_REJECT.includes(t);
}
function wordish(text){ return (text||'').trim(); }

/* limpia texto de una sola línea: saca tabs/saltos de línea y espacios repetidos */
function cleanLine(text){
  return (text||'').replace(/[\t\r\n]+/g,' ').replace(/\s{2,}/g,' ').trim();
}
/* saca un prefijo "REPORTE A3 Nº" repetido que el usuario haya escrito sin querer */
function cleanReporteNro(text){
  let t = cleanLine(text);
  const prefixRe = /^(reporte\s*a3\s*)?n[°ºo]\.?\s*/i;
  // aplica dos veces por si el usuario llegó a duplicarlo
  t = t.replace(prefixRe,'').replace(prefixRe,'').trim();
  return t;
}

/* ---------- autosave (window.storage, personal) ---------- */
let saveTimer=null;
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    try{
      if(window.storage){
        await window.storage.set('a3_draft', JSON.stringify({state, maxUnlocked, stepStatus}), false);
      }
    }catch(e){ /* silencioso */ }
  }, 500);
}
async function loadDraft(){
  try{
    if(!window.storage) return;
    const res = await window.storage.get('a3_draft', false);
    if(res && res.value){
      const parsed = JSON.parse(res.value);
      Object.assign(state.header, parsed.state.header||{});
      Object.assign(state.s1, parsed.state.s1||{});
      Object.assign(state.s2, parsed.state.s2||{});
      Object.assign(state.s3, parsed.state.s3||{});
      Object.assign(state.s4, parsed.state.s4||{});
      Object.assign(state.s5, parsed.state.s5||{});
      Object.assign(state.s6, parsed.state.s6||{});
      if(parsed.maxUnlocked!==undefined) maxUnlocked = parsed.maxUnlocked;
      if(parsed.stepStatus) parsed.stepStatus.forEach((v,i)=>stepStatus[i]=v);
    }
  }catch(e){ /* no había borrador o formato viejo: se ignora */ }
}

/* =========================================================================
   RENDER: SIDEBAR
   ========================================================================= */
function renderSidebar(){
  const list = $('#stepList');
  list.innerHTML = STEPS.map((s,i)=>{
    const enabled = i<=maxUnlocked;
    const active = i===current;
    const done = stepStatus[i];
    return `<li class="step-item ${enabled?'enabled':''} ${active?'active':''} ${done?'done':''}" data-step="${i}">
      <div class="step-num">${s.num}</div>
      <div class="step-name">${s.name}</div>
      <span class="step-tag ${done?'ok':'pending'}">${done?'VALIDADO':'PENDIENTE'}</span>
    </li>`;
  }).join('');
  $$('.step-item', list).forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = Number(el.dataset.step);
      if(i<=maxUnlocked){ current=i; lastErrors=[]; renderAll(); }
    });
  });
}

/* =========================================================================
   RENDER: MAIN por paso
   ========================================================================= */
function renderMain(){
  const main = $('#main');
  const step = STEPS[current];
  const isLast = current === STEPS.length-1;

  let bodyHtml = '';
  if(step.key==='header') bodyHtml = renderHeaderStep();
  else if(step.key==='s1') bodyHtml = renderS1();
  else if(step.key==='s2') bodyHtml = renderS2();
  else if(step.key==='s3') bodyHtml = renderS3();
  else if(step.key==='s4') bodyHtml = renderS4();
  else if(step.key==='s5') bodyHtml = renderS5();
  else if(step.key==='s6') bodyHtml = renderS6();

  const errorsHtml = lastErrors.length ? `
    <div class="errors">
      <strong>Este punto todavía no cumple los requisitos — corregí lo siguiente para poder avanzar:</strong>
      <ul>${lastErrors.map(e=>`<li>${esc(e)}</li>`).join('')}</ul>
    </div>` : '';

  const stampHtml = stepStatus[current] && lastErrors.length===0
    ? `<div class="stamp">✓ Validado</div>` : '';

  main.innerHTML = `
    <div class="topline">
      <div>
        <div class="eyebrow">Paso ${step.num} de ${STEPS.length-1===current? '06':'06'}</div>
        <h1 class="step-title">${step.name}</h1>
      </div>
      ${stampHtml}
    </div>
    <p class="step-sub">${stepDescription(step.key)}</p>
    ${errorsHtml}
    ${bodyHtml}
    <div class="actions-bar">
      <button class="btn btn-ghost" id="btnBack" ${current===0?'disabled style="visibility:hidden"':''}>← Volver</button>
      <button class="btn btn-primary" id="btnNext">${isLast ? 'Validar y generar Excel A3' : 'Validar y continuar →'}</button>
    </div>
  `;

  bindStepInputs(step.key);
  $('#btnBack')?.addEventListener('click', ()=>{ if(current>0){ current--; lastErrors=[]; renderAll(); }});
  $('#btnNext').addEventListener('click', onNextClicked);
}

function stepDescription(key){
  return {
    header: 'Datos de identificación del reporte. La fecha de inicio se usa además para controlar que el plazo del objetivo (punto 2) no supere los 6 meses.',
    s1: 'El problema tiene que estar redactado con datos objetivos y verificables (no opiniones), y tiene que dejar clara su relevancia para el proceso.',
    s2: 'El objetivo debe ser SMART: específico, medible, alcanzable, relevante y con plazo definido (máximo 6 meses). Tiene que incluir el indicador que mostrará la evolución y cómo se va a verificar la eficacia de las acciones.',
    s3: 'La situación actual tiene que estar basada en una herramienta de análisis de causa raíz (5 Porqués, Ishikawa, Pareto, etc.), no en una descripción superficial del síntoma.',
    s4: 'Cada acción propuesta necesita responsable y fecha. Además hay que definir la contramedida / Poka Yoke para que el problema no vuelva a aparecer.',
    s5: 'Registrá las acciones que efectivamente se implementaron, con su fecha real de ejecución.',
    s6: 'Acá se cierra la verificación de eficacia: plazo de evaluación, indicador utilizado, resultado cuantificado contra ese indicador y conclusión (eficaz / no eficaz).'
  }[key];
}

/* ---------- STEP 0: Header ---------- */
function renderHeaderStep(){
  const h = state.header;
  return `<div class="card">
    <div class="row2">
      <div class="field">
        <label>Fecha de inicio <span class="req">*</span></label>
        <input type="date" data-bind="header.fechaInicio" value="${h.fechaInicio}">
      </div>
      <div class="field">
        <label>Reporte A3 Nº <span class="req">*</span></label>
        <input type="text" data-bind="header.reporteNro" value="${esc(h.reporteNro)}" placeholder="Ej: 014" maxlength="20">
        <div class="hint">Poné sólo el número o código (máx. 20 caracteres) — el texto "REPORTE A3 Nº" ya lo agrega la plantilla, no hace falta escribirlo.</div>
      </div>
    </div>
    <div class="row2">
      <div class="field">
        <label>Sector / Integrantes <span class="req">*</span></label>
        <input type="text" data-bind="header.sector" value="${esc(h.sector)}" placeholder="Ej: Envasado — J. Pérez, M. Gómez, R. Díaz" maxlength="75">
      </div>
      <div class="field">
        <label>Título del reporte <span class="req">*</span></label>
        <input type="text" data-bind="header.titulo" value="${esc(h.titulo)}" placeholder="Título breve y concreto del problema" maxlength="70">
      </div>
    </div>
  </div>`;
}

/* ---------- STEP 1: Problemática ---------- */
function renderS1(){
  const s = state.s1;
  return `<div class="card">
    <div class="field">
      <label>Descripción del problema <span class="req">*</span></label>
      <textarea data-bind="s1.problema" rows="4" maxlength="260" placeholder="Qué pasa, dónde, desde cuándo y con qué magnitud (usá datos, no opiniones). Ej: 'Desde marzo 2026 la línea 2 registra 8,4% de rechazo por fisuras, vs. 2% histórico.'">${esc(s.problema)}</textarea>
      <div class="hint">Máx. 260 caracteres — la caja del Excel es de tamaño fijo, sé concreto (esto es justamente el espíritu de un A3). Incluí al menos un dato numérico verificable y evitá opiniones ("creo que", "me parece", "tal vez").</div>
    </div>

/* ---------- Ishikawa: diagrama SVG (espina de pescado) ---------- */
function truncate(text, n){
  const t = (text||'').trim();
  return t.length > n ? t.slice(0, n-1) + '…' : t;
}

function buildFishboneSvg(problemaLabel, categorias){
  const W = 960, H = 460;
  const spineY = H/2;
  const spineXStart = 60, spineXEnd = 790;
  const top = categorias.slice(0,3);
  const bottom = categorias.slice(3,6);
  const topX = [230,430,630];
  const bottomX = [280,480,680];

  function bone(cat, x, isTop){
    const dx = 110, dy = isTop ? -130 : 130;
    const x2 = x - dx, y2 = spineY + dy;
    const causas = cat.causas.filter(c=>wordish(c));
    const causasTxt = causas.length ? causas : [];
    let s = `<line x1="${x}" y1="${spineY}" x2="${x2}" y2="${y2}" stroke="#3C5A72" stroke-width="2.5"/>`;
    const labelY = isTop ? y2 - 10 : y2 + 24;
    s += `<text x="${x2}" y="${labelY}" font-family="Oswald, sans-serif" font-weight="600" font-size="15" fill="#1B2430" text-anchor="middle">${esc(cat.nombre)}</text>`;
    const shown = causasTxt.slice(0,4);
    shown.forEach((c,i)=>{
      const t = (i+1)/(shown.length+1);
      const tx = x + (x2-x)*t;
      const ty = spineY + (y2-spineY)*t;
      s += `<line x1="${tx-8}" y1="${ty+(isTop?8:-8)}" x2="${tx+8}" y2="${ty-(isTop?8:-8)}" stroke="#8A93A0" stroke-width="1"/>`;
      const anchor = isTop ? 'end' : 'start';
      const tdx = isTop ? -6 : 6;
      const tdy = isTop ? -6 : 15;
      s += `<text x="${tx+tdx}" y="${ty+tdy}" font-family="Inter, sans-serif" font-size="10.5" fill="#5B6672" text-anchor="${anchor}">${esc(truncate(c,26))}</text>`;
    });
    if(!shown.length){
      const midX = (x+x2)/2, midY = (spineY+y2)/2;
      const anchor = isTop ? 'end' : 'start';
      s += `<text x="${midX+(isTop?-6:6)}" y="${midY}" font-family="Inter, sans-serif" font-size="10" font-style="italic" fill="#B9C2CA" text-anchor="${anchor}">(sin causas cargadas)</text>`;
    }
    return s;
  }

  let bones = '';
  top.forEach((cat,i)=> bones += bone(cat, topX[i], true));
  bottom.forEach((cat,i)=> bones += bone(cat, bottomX[i], false));

  const headW = 150, headH = 74;
  const headX = spineXEnd + 14, headY = spineY - headH/2;

  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%" height="auto" style="max-width:960px;display:block;background:#fff;">
    <rect x="0" y="0" width="${W}" height="${H}" fill="#ffffff"/>
    <line x1="${spineXStart}" y1="${spineY}" x2="${spineXEnd}" y2="${spineY}" stroke="#1B2430" stroke-width="3"/>
    <polygon points="${spineXEnd},${spineY-10} ${spineXEnd+16},${spineY} ${spineXEnd},${spineY+10}" fill="#1B2430"/>
    ${bones}
    <rect x="${headX}" y="${headY}" width="${headW}" height="${headH}" rx="8" fill="#E8A33D" stroke="#402D06" stroke-width="1.5"/>
    <foreignObject x="${headX+8}" y="${headY+6}" width="${headW-16}" height="${headH-12}">
      <div xmlns="http://www.w3.org/1999/xhtml" style="font-family:Inter,sans-serif;font-size:11px;font-weight:600;color:#402D06;line-height:1.3;overflow:hidden;">${esc(truncate(problemaLabel,110))}</div>
    </foreignObject>
  </svg>`;
}

function renderIshikawaPreview(){
  const wrap = $('#ishikawaSvgWrap');
  if(!wrap) return;
  const problema = wordish(state.s1.problema) || 'Problema a analizar';
  wrap.innerHTML = buildFishboneSvg(problema, state.s3.ishikawa.categorias);
}

async function downloadIshikawaPng(){
  const wrap = $('#ishikawaSvgWrap');
  const svgEl = wrap?.querySelector('svg');
  if(!svgEl) return;
  try{
    const svgStr = new XMLSerializer().serializeToString(svgEl);
    const svgB64 = btoa(unescape(encodeURIComponent(svgStr)));
    const dataUrl = `data:image/svg+xml;base64,${svgB64}`;
    const img = new Image();
    await new Promise((resolve,reject)=>{ img.onload=resolve; img.onerror=reject; img.src=dataUrl; });
    const scale = 2;
    const canvas = document.createElement('canvas');
    canvas.width = 960*scale; canvas.height = 460*scale;
    const ctx = canvas.getContext('2d');
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(0,0,canvas.width,canvas.height);
    ctx.scale(scale,scale);
    ctx.drawImage(img,0,0,960,460);
    canvas.toBlob(blob=>{
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      const nro = wordish(state.header.reporteNro) || 'sin_numero';
      a.href = url;
      a.download = `Ishikawa_${nro}.png`;
      document.body.appendChild(a);
      a.click();
      a.remove();
      setTimeout(()=>URL.revokeObjectURL(url), 4000);
    }, 'image/png');
  }catch(err){
    console.error(err);
    alert('No se pudo generar la imagen PNG del diagrama.');
  }
}

/* =========================================================================
   BINDING de inputs (genérico via data-bind="a.b.c")
   ========================================================================= */
function getPath(obj, path){
  return path.split('.').reduce((o,k)=> (o==null?o:o[k]), obj);
}
function setPath(obj, path, val){
  const keys = path.split('.');
  let o = obj;
  for(let i=0;i<keys.length-1;i++){
    o = o[keys[i]];
  }
  o[keys[keys.length-1]] = val;
}

function bindStepInputs(stepKey){
  $$('[data-bind]').forEach(el=>{
    const evt = (el.tagName==='SELECT' || el.type==='date') ? 'change' : 'input';
    el.addEventListener(evt, ()=>{
      setPath(state, el.dataset.bind, el.value);
      scheduleSave();
      // re-render dinámico si cambia la conclusión de sección 6 (para mostrar/ocultar campos)
      if(el.dataset.bind==='s6.conclusion'){
        renderMain();
      } else if(el.dataset.bind.startsWith('s3.ishikawa.')){
        renderIshikawaPreview();
      }
    });
  });

  $$('[data-toggle-herramienta]').forEach(cb=>{
    cb.addEventListener('change', ()=>{
      const name = cb.dataset.toggleHerramienta;
      const list = state.s3.herramientas;
      const idx = list.indexOf(name);
      if(cb.checked && idx===-1) list.push(name);
      else if(!cb.checked && idx!==-1) list.splice(idx,1);
      scheduleSave();
      renderMain();
    });
  });

  if(stepKey==='s4'){
    $('#addAccion')?.addEventListener('click', ()=>{
      state.s4.acciones.push({accion:'',responsable:'',fecha:''});
      renderMain();
    });
    $$('[data-rm-accion]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = Number(btn.dataset.rmAccion);
        state.s4.acciones.splice(i,1);
        renderMain();
      });
    });
  }
  if(stepKey==='s5'){
    $('#addRealizada')?.addEventListener('click', ()=>{
      state.s5.realizadas.push({accion:'',fecha:''});
      renderMain();
    });
    $$('[data-rm-realizada]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const i = Number(btn.dataset.rmRealizada);
        state.s5.realizadas.splice(i,1);
        renderMain();
      });
    });
  }
  if(stepKey==='s3'){
    $$('[data-add-causa]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const ci = Number(btn.dataset.addCausa);
        state.s3.ishikawa.categorias[ci].causas.push('');
        renderMain();
      });
    });
    $$('[data-rm-causa]').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        const [ci,cj] = btn.dataset.rmCausa.split(':').map(Number);
        state.s3.ishikawa.categorias[ci].causas.splice(cj,1);
        renderMain();
      });
    });
    if(state.s3.herramientas.includes('Ishikawa (espina de pescado)')){
      renderIshikawaPreview();
      $('#btnDownloadIshikawaPng')?.addEventListener('click', downloadIshikawaPng);
    }
  }
}

function validateHeader(){

  if(!wordish(h.reporteNro)) errs.push('Falta el número de reporte A3.');
  if(!wordish(h.sector)) errs.push('Falta el sector / integrantes.');
  if(!wordish(h.titulo)) errs.push('Falta el título del reporte.');
  return errs;
}

function validateS1(){
  const s = state.s1, errs=[];
  const p = wordish(s.problema);
  if(p.length < 40) errs.push('La descripción del problema es demasiado breve o vaga (mínimo 40 caracteres). Agregá qué pasa, dónde y con qué magnitud.');
  const subj = hasSubjectiveLanguage(p);
  if(subj) errs.push(`El problema parece redactado en forma subjetiva ("${subj}"). Reformulalo con datos objetivos y verificables.`);
  if(!hasQuantData(p)) errs.push('El problema tiene que incluir al menos un dato cuantificable (%, cantidad, frecuencia) para que sea medible.');
  if(!wordish(s.areaProceso)) errs.push('Falta indicar el proceso / área / línea afectada.');
  if(wordish(s.impacto).length < 15) errs.push('Falta justificar por qué el problema es relevante para el proceso (impacto).');
  return errs;
}

function validateS2(){
  const s = state.s2, errs=[];
  const obj = wordish(s.objetivo);
  if(obj.length < 30) errs.push('El objetivo es demasiado breve. Redactalo de forma específica y medible.');
  if(!hasQuantData(obj) && !hasQuantData(s.metaValor)) errs.push('El objetivo o la meta tienen que incluir un valor numérico (específico y medible).');
  if(!wordish(s.indicador)) errs.push('Falta el indicador que va a mostrar la evolución.');
  if(!wordish(s.metaValor)) errs.push('Falta la meta / valor objetivo.');
  if(!s.plazoFecha){
    errs.push('Falta la fecha límite del objetivo.');
  } else if(!state.header.fechaInicio){
    errs.push('Definí primero la fecha de inicio en "Datos generales" para poder validar el plazo.');
  } else {
    const d1 = parseISO(state.header.fechaInicio);
    const d2 = parseISO(s.plazoFecha);
    const months = monthsBetween(d1,d2);
    if(months===null) errs.push('La fecha del plazo no es válida.');
    else if(months <= 0) errs.push('El plazo tiene que ser posterior a la fecha de inicio del reporte.');
    else if(months > 6.2) errs.push(`El plazo definido supera los 6 meses desde el inicio (son aprox. ${months.toFixed(1)} meses). El objetivo tiene que ser alcanzable en 6 meses o menos.`);
  }
  if(wordish(s.verificacion).length < 30) errs.push('Falta describir con más detalle el modo de verificación de la eficacia (cómo y cuándo se va a comprobar).');
  return errs;
}

function validateS3(){
  const s = state.s3, errs=[];
  if(!s.herramientas.length) errs.push('Elegí al menos una herramienta de análisis de causa raíz utilizada.');

  const usaOtras = s.herramientas.includes('Diagrama de Pareto') || s.herramientas.includes('Otra');
  if(usaOtras && wordish(s.detalleHerramienta).length < 10){
    errs.push('Detallá cómo se aplicó la herramienta de análisis elegida (Pareto / Otra).');
  }
  const resumen = wordish(s.resumenAnalisis);
  if(resumen.length < 50) errs.push('El resumen del análisis es muy breve (mínimo 50 caracteres). Tiene que mostrar el resultado del análisis de causa raíz.');
  if(!/causa|raíz|raiz/i.test(resumen)) errs.push('El resumen tiene que hacer referencia explícita a la causa raíz identificada.');

  if(s.herramientas.includes('5 Porqués')){
    const b = s.why[0];
    const filled = [b.w1,b.w2,b.w3,b.w4,b.w5].every(v=>wordish(v).length>0);
    if(!filled) errs.push('Completá las 5 preguntas "¿Por qué?" de la rama 1 (los 5 Porqués tienen que llegar hasta el quinto nivel).');
    if(!wordish(b.resultado)) errs.push('Indicá la causa raíz encontrada al final de la rama 1 del análisis de 5 Porqués.');
  }
  if(s.herramientas.includes('Ishikawa (espina de pescado)')){
    const catsConCausas = s.ishikawa.categorias.filter(c=>c.causas.some(x=>wordish(x)));
    if(catsConCausas.length < 4) errs.push('En el diagrama de Ishikawa, cargá al menos una causa en 4 de las 6 categorías (6M).');
  }
  return errs;
}

function validateS4(){
  const s = state.s4, errs=[];
  const validAcciones = s.acciones.filter(a=>wordish(a.accion) && wordish(a.responsable) && a.fecha);
  if(validAcciones.length===0){
    errs.push('Agregá al menos una acción propuesta completa (acción, responsable y fecha).');
  } else {
    s.acciones.forEach((a,i)=>{
      if(!wordish(a.accion) && !wordish(a.responsable) && !a.fecha) return; // fila vacía, se ignora
      if(!wordish(a.accion) || a.accion.trim().length<8) errs.push(`Acción ${i+1}: falta describirla o es demasiado breve.`);
      if(!wordish(a.responsable)) errs.push(`Acción ${i+1}: falta el responsable.`);
      if(!a.fecha) errs.push(`Acción ${i+1}: falta la fecha compromiso.`);
    });
  }
  const cm = wordish(s.contramedidas);
  if(cm.length < 20) errs.push('Falta describir la contramedida / Poka Yoke para evitar que el problema reaparezca.');
  else if(isPlaceholder(cm)) errs.push('La contramedida / Poka Yoke no puede quedar como "N/A" o similar: tiene que describir una acción concreta.');
  if(!s.fechaCompromiso) errs.push('Falta la fecha de compromiso.');
  return errs;
}

function validateS5(){
  const s = state.s5, errs=[];
  const validas = s.realizadas.filter(a=>wordish(a.accion) && a.fecha);
  if(validas.length===0) errs.push('Agregá al menos una acción realizada, con su fecha de ejecución.');
  else {
    s.realizadas.forEach((a,i)=>{
      if(!wordish(a.accion) && !a.fecha) return;
      if(!wordish(a.accion) || a.accion.trim().length<8) errs.push(`Acción realizada ${i+1}: falta describirla o es demasiado breve.`);
      if(!a.fecha) errs.push(`Acción realizada ${i+1}: falta la fecha de ejecución.`);
    });
  }
  if(!s.fechaImplementacion) errs.push('Falta la fecha de implementación.');
  return errs;
}

function validateS6(){
  const s = state.s6, errs=[];
  if(!wordish(s.plazoEvaluacion)) errs.push('Falta el plazo de evaluación.');
  if(!wordish(s.indicadorCriterio)) errs.push('Falta el indicador o criterio utilizado para verificar la eficacia.');
  const res = wordish(s.resultado);
  if(res.length < 30) errs.push('El resultado es demasiado breve: tiene que describir con detalle lo observado.');
  if(!hasQuantData(res)) errs.push('El resultado tiene que incluir el valor numérico obtenido, para poder comparar contra la meta del punto 2.');
  if(!s.conclusion) errs.push('Falta indicar la conclusión (eficaz / no eficaz).');
  if(s.conclusion==='NO EFICAZ' && wordish(s.accionesAdicionales).length < 20){
    errs.push('Si la conclusión es "NO EFICAZ", tenés que indicar qué acciones adicionales o próximos pasos se van a tomar.');
  }
  if(!s.fechaCierre) errs.push('Falta la fecha de cierre.');
  if(!wordish(s.responsableCierre)) errs.push('Falta el responsable del cierre.');
  return errs;
}

const VALIDATORS = [validateHeader, validateS1, validateS2, validateS3, validateS4, validateS5, validateS6];

function validateStep(i){
  return VALIDATORS[i]();
}

/* =========================================================================
   NAVEGACIÓN
   ========================================================================= */
async function onNextClicked(){
  const errs = validateStep(current);
  if(errs.length){
    lastErrors = errs;
    stepStatus[current] = false;
    renderAll();
    return;
  }
  lastErrors = [];
  stepStatus[current] = true;
  scheduleSave();

  if(current === STEPS.length-1){
    // paso final: re-validar TODO antes de generar
    for(let i=0;i<STEPS.length;i++){
      const e = validateStep(i);
      stepStatus[i] = e.length===0;
      if(e.length){
        current = i;
        lastErrors = e;
        maxUnlocked = Math.max(maxUnlocked, i);
        renderAll();
        return;
      }
    }
    renderAll();
    await generateExcel();
    return;
  }

  maxUnlocked = Math.max(maxUnlocked, current+1);
  current += 1;
  renderAll();
}

function renderAll(){
  renderSidebar();
  renderMain();
}

/* =========================================================================
   GENERACIÓN DEL EXCEL (xlsx-populate, sobre la plantilla real)
   ========================================================================= */
function base64ToArrayBuffer(b64){
  const bin = atob(b64);
  const len = bin.length;
  const bytes = new Uint8Array(len);
  for(let i=0;i<len;i++) bytes[i] = bin.charCodeAt(i);
  return bytes.buffer;
}

function setCell(sheet, ref, value){
  const cell = sheet.cell(ref);
  cell.value(value);
  // Se fuerza color de texto negro y sin subrayado (evita que quede en azul/subrayado
  // tipo hipervínculo); no se toca "bold" para respetar el formato original de cada celda.
  cell.style({
    wrapText:true, verticalAlignment:'top',
    underline:false, fontColor:'1B2430', fontFamily:'Calibri'
  });
  return cell;
}

/* Red de seguridad: si el texto se acerca o supera la capacidad estimada de la
   caja (en caracteres, calibrada contra la plantilla real), achica la fuente
   para evitar que se corte o se superponga con la celda de abajo. */
function setCellFit(sheet, ref, value, capacity){
  const cell = setCell(sheet, ref, value);
  const len = (value||'').length;
  let size = 11;
  if(len > capacity) size = 8;
  else if(len > capacity*0.82) size = 9.5;
  else if(len > capacity*0.62) size = 10.5;
  if(size < 11) cell.style({fontSize:size});
  return cell;
}

async function generateExcel(){
  const btn = $('#btnNext');
  if(btn){ btn.disabled = true; btn.textContent = 'Generando Excel...'; }
  try{
    const b64 = document.getElementById('template-b64').textContent.trim();
    const buffer = base64ToArrayBuffer(b64);
    const workbook = await XlsxPopulate.fromDataAsync(buffer);
    const wsA3 = workbook.sheet(0);
    const wsWhy = workbook.sheet(1);

    const h = state.header, s1 = state.s1, s2 = state.s2, s3 = state.s3,
          s4 = state.s4, s5 = state.s5, s6 = state.s6;

    /* ----- Encabezado ----- */
    setCell(wsA3, 'B3', fmtDate(h.fechaInicio));
    setCell(wsA3, 'D2', `REPORTE A3 Nº ${cleanReporteNro(h.reporteNro)}`);
    setCell(wsA3, 'M2', cleanLine(h.sector));
    setCell(wsA3, 'D4', cleanLine(h.titulo));

    /* ----- 1. Problemática ----- */
    const textoProblema = [
      cleanLine(s1.problema),
      '',
      `Área: ${cleanLine(s1.areaProceso)}`,
      `Impacto: ${cleanLine(s1.impacto)}`
    ].join('\n');
    setCellFit(wsA3, 'B8', textoProblema, 390);

    /* ----- 2. Metas / Objetivos ----- */
    setCellFit(wsA3, 'B16', `Objetivo: ${cleanLine(s2.objetivo)}`, 234);
    setCell(wsA3, 'B19', `Indicador: ${cleanLine(s2.indicador)}`);
    setCell(wsA3, 'B20', `Meta: ${cleanLine(s2.metaValor)}`);
    setCell(wsA3, 'B21', `Plazo: ${fmtDate(s2.plazoFecha)}`);
    // "Modo de verificación de eficacia" necesita más espacio: se amplía a 2 filas (B22:J23)
    if(!wsA3.range('B22:J23').merged()) wsA3.range('B22:J23').merged(true);
    setCellFit(wsA3, 'B22', `Verificación: ${cleanLine(s2.verificacion)}`, 156);

    /* ----- 3. Situación actual ----- */
    if(!wsA3.range('C31:J35').merged()) wsA3.range('C31:J35').merged(true);
    const usaWhy = s3.herramientas.includes('5 Porqués');
    const usaIshikawa = s3.herramientas.includes('Ishikawa (espina de pescado)');
    const otrasHerr = s3.herramientas.filter(h=>h!=='5 Porqués' && h!=='Ishikawa (espina de pescado)');

    const herramientaPartes = [];
    if(usaWhy) herramientaPartes.push('5 Porqués');
    if(usaIshikawa){
      const catCount = s3.ishikawa.categorias.filter(c=>c.causas.some(x=>wordish(x))).length;
      const causaCount = s3.ishikawa.categorias.reduce((n,c)=>n+c.causas.filter(x=>wordish(x)).length,0);
      herramientaPartes.push(`Ishikawa (${catCount} categorías, ${causaCount} causas)`);
    }
    if(otrasHerr.length) herramientaPartes.push(`${otrasHerr.join(' / ')} — ${cleanLine(s3.detalleHerramienta)}`);
    const herramientaTxt = herramientaPartes.join(' + ');

    const refsHojas = [];
    if(usaWhy) refsHojas.push('"5 porqué"');
    if(usaIshikawa) refsHojas.push('"Ishikawa"');

    let textoS3 = `Herramienta(s): ${herramientaTxt}\n\n${cleanLine(s3.resumenAnalisis)}`;
    if(refsHojas.length) textoS3 += `\n\n(Ver hoja ${refsHojas.join(' y ')})`;
    setCellFit(wsA3, 'C31', textoS3, 335);

    if(usaWhy){
      setCell(wsWhy, 'A4', cleanLine(s1.problema));
      s3.why.forEach((b,i)=>{
        const row = 4+i;
        if(!wordish(b.w1) && !wordish(b.w2) && !wordish(b.w3) && !wordish(b.w4) && !wordish(b.w5) && !wordish(b.resultado)) return;
        setCell(wsWhy, `B${row}`, cleanLine(b.w1));
        setCell(wsWhy, `C${row}`, cleanLine(b.w2));
        setCell(wsWhy, `D${row}`, cleanLine(b.w3));
        setCell(wsWhy, `E${row}`, cleanLine(b.w4));
        setCell(wsWhy, `F${row}`, cleanLine(b.w5));
        setCell(wsWhy, `G${row}`, cleanLine(b.resultado));
      });
    }

    if(usaIshikawa){
      const wsIshikawa = workbook.addSheet('Ishikawa');
      wsIshikawa.column('A').width(22);
      wsIshikawa.column('B').width(70);
      setCell(wsIshikawa, 'A1', 'Categoría (6M)');
      setCell(wsIshikawa, 'B1', 'Causa identificada');
      wsIshikawa.range('A1:B1').style({bold:true, fill:'E8A33D', fontColor:'402D06'});
      let r = 2;
      s3.ishikawa.categorias.forEach(cat=>{
        cat.causas.filter(c=>wordish(c)).forEach(c=>{
          setCell(wsIshikawa, `A${r}`, cat.nombre);
          setCell(wsIshikawa, `B${r}`, cleanLine(c));
          r++;
        });
      });
      r++;
      setCell(wsIshikawa, `A${r}`, 'Problema analizado:');
      wsIshikawa.cell(`A${r}`).style({bold:true});
      setCell(wsIshikawa, `B${r}`, cleanLine(s1.problema));
    }

    /* ----- 4. Acciones propuestas ----- */
    if(!wsA3.range('L8:Q23').merged()) wsA3.range('L8:Q23').merged(true);
    const accionesValidas = s4.acciones.filter(a=>wordish(a.accion)||wordish(a.responsable)||a.fecha);
    setCell(wsA3, 'L8', accionesValidas.map(a=>cleanLine(a.accion)).join('\n'));
    setCell(wsA3, 'R8', accionesValidas.map(a=>cleanLine(a.responsable)).join('\n'));
    setCell(wsA3, 'U8', accionesValidas.map(a=>fmtDate(a.fecha)).join('\n'));

    if(!wsA3.range('K28:U33').merged()) wsA3.range('K28:U33').merged(true);
    setCellFit(wsA3, 'K28', cleanLine(s4.contramedidas), 600);
    setCell(wsA3, 'S36', fmtDate(s4.fechaCompromiso));

    /* ----- 5. Acciones correctivas realizadas ----- */
    const pares = [['L42','T42'],['L44','T44'],['L46','T46'],['L48','T48'],['L50','T50']];
    const realizadasValidas = s5.realizadas.filter(a=>wordish(a.accion)||a.fecha);
    pares.forEach((p,i)=>{
      const item = realizadasValidas[i];
      if(item){
        setCell(wsA3, p[0], cleanLine(item.accion));
        setCell(wsA3, p[1], fmtDate(item.fecha));
      }
    });
    setCell(wsA3, 'S54', fmtDate(s5.fechaImplementacion));

    /* ----- 6. Seguimiento / Verificación de eficacia ----- */
    if(!wsA3.range('M59:O59').merged()) wsA3.range('M59:O59').merged(true);
    setCell(wsA3, 'M59', cleanLine(s6.plazoEvaluacion));
    wsA3.cell('M59').style({fontSize:11, fontFamily:'Calibri'});
    setCell(wsA3, 'Q59', s6.conclusion);
    setCell(wsA3, 'N61', cleanLine(s6.indicadorCriterio));
    if(!wsA3.range('L65:S70').merged()) wsA3.range('L65:S70').merged(true);
    let resultadoTxt = cleanLine(s6.resultado);
    if(s6.conclusion==='NO EFICAZ' && wordish(s6.accionesAdicionales)){
      resultadoTxt += `\n\nPróximos pasos: ${cleanLine(s6.accionesAdicionales)}`;
    }
    setCellFit(wsA3, 'L65', resultadoTxt, 400);
    if(wordish(s6.formulariosLoyal)) setCell(wsA3, 'T61', cleanLine(s6.formulariosLoyal));
    setCell(wsA3, 'T65', fmtDate(s6.fechaCierre));
    setCell(wsA3, 'T68', cleanLine(s6.responsableCierre));

    /* ----- descarga ----- */
    const blob = await workbook.outputAsync();
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    const nro = wordish(h.reporteNro) || 'sin_numero';
    a.href = url;
    a.download = `Reporte_A3_${nro}.xlsx`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);

    showDoneScreen();
  }catch(err){
    console.error(err);
    alert('Hubo un error generando el Excel: ' + err.message);
    if(btn){ btn.disabled=false; btn.textContent='Validar y generar Excel A3'; }
  }
}

  const main = $('#main');
  main.innerHTML = `
    <div class="topline">
      <div>
        <div class="eyebrow">Reporte A3 Nº ${esc(state.header.reporteNro)}</div>
        <h1 class="step-title">Excel generado ✓</h1>
      </div>
      <div class="stamp">✓ Completo</div>
    </div>
    <p class="step-sub">El archivo se descargó con el formato original de la plantilla, celdas combinadas y la hoja de 5 Porqués incluida. Revisá tu carpeta de descargas.</p>
    <div class="card">
      <div class="summary-grid">
        <div class="summary-card"><h4>1. Problemática</h4><p><b>${esc(state.s1.areaProceso)}</b></p><p>${esc(state.s1.problema)}</p></div>
        <div class="summary-card"><h4>2. Objetivo</h4><p>${esc(state.s2.objetivo)}</p><p><b>Plazo:</b> ${fmtDate(state.s2.plazoFecha)}</p></div>
        <div class="summary-card"><h4>3. Situación actual</h4><p><b>${esc(state.s3.herramientas.join(' + '))}</b></p><p>${esc(state.s3.resumenAnalisis)}</p></div>
        <div class="summary-card"><h4>4. Acciones propuestas</h4><p>${state.s4.acciones.filter(a=>wordish(a.accion)).length} acción(es) · Poka Yoke definido</p></div>
        <div class="summary-card"><h4>5. Acciones realizadas</h4><p>${state.s5.realizadas.filter(a=>wordish(a.accion)).length} acción(es) implementada(s)</p></div>

      </div>
    </div>
    <div class="actions-bar">
      <button class="btn btn-ghost" id="btnEditAgain">← Volver a editar</button>

    </div>
  `;
  $('#btnEditAgain').addEventListener('click', ()=>{ current=STEPS.length-1; renderAll(); });
  $('#btnDownloadAgain').addEventListener('click', generateExcel);
}
